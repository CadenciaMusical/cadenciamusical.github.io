<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadencia</title>
  <meta name="description" content="Escribe unos acordes y descubre su tonalidad, sus grados y su función. Teoría musical para principiantes, para oír y no solo leer.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#E2603A">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <noscript><p class="noscript">Cadencia necesita JavaScript para analizar y hacer sonar los acordes.</p></noscript>
  <header class="topbar">
    <a id="home" class="brand" href="./" aria-label="Cadencia: volver al inicio">
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <h1>Cadencia</h1>
    </a>
    <div class="topbar-actions">
      <div id="notation" class="segmented compact" role="group" aria-label="Cifrado">
        <button type="button" class="seg" data-notation="latin" aria-pressed="false">Do Re Mi</button>
        <button type="button" class="seg" data-notation="american" aria-pressed="false">C D E</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card input-card">
      <form id="form" autocomplete="off">
        <label for="chords" class="label">Escribe unos acordes</label>
        <div class="input-row">
          <div class="input-field">
            <div id="chords-marks" class="input-marks" aria-hidden="true"></div>
            <textarea id="chords" rows="1" placeholder="Lam Fa Do Sol" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="errors"></textarea>
          </div>
          <button type="submit" class="btn primary">Analizar</button>
        </div>
        <p class="hint">Sepáralos con espacios. Vale el cifrado americano (Am F C G) y el latino (Lam Fa Do Sol).</p>
      </form>
      <details id="examples-menu" class="examples-menu">
        <summary>O prueba un ejemplo</summary>
        <div id="examples" class="chips"></div>
      </details>
      <div id="errors" aria-live="polite"></div>
    </section>

    <section id="result" hidden aria-live="polite">
      <div id="key-card" class="card key-card"></div>
      <div id="progression-card" class="card progression-card" hidden></div>

      <h2 class="section-title">Los acordes</h2>
      <p class="hint">Toca un acorde para oírlo y ver qué hace.</p>
      <div id="chord-grid" class="chord-grid"></div>
      <div id="detail" class="card detail" hidden></div>

      <div id="modes-card" class="card"></div>
      <div id="transpose-card" class="card"></div>
    </section>

    <details class="card glossary">
      <summary>Glosario</summary>
      <p class="hint">Las palabras subrayadas de toda la app también se pueden tocar.</p>
      <div id="glossary-list" class="chips"></div>
    </details>
  </main>

  <dialog id="term-dialog" class="sheet" aria-labelledby="term-title">
    <div class="sheet-inner">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="term-title"></h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="term-body"></div>
    <button type="button" id="term-play" class="btn primary wide">▶ Escúchalo</button>
    </div>
  </dialog>

  <!-- En móvil, el detalle del acorde elegido sale aquí, desde abajo. -->
  <dialog id="detail-sheet" class="sheet detail-sheet" aria-label="El acorde elegido">
    <div class="sheet-inner">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button type="button" class="icon-btn sheet-close" data-close aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="detail-body"></div>
    </div>
  </dialog>

  <div id="update-toast" class="toast" role="status" hidden>
    <span>Hay una versión nueva de Cadencia.</span>
    <button type="button" id="update-btn" class="btn primary small">Actualizar</button>
  </div>

  <div class="playbar">
    <button type="button" id="play" class="btn primary wide" disabled aria-pressed="false">▶ Escuchar progresión</button>
  </div>
</body>
</html>
